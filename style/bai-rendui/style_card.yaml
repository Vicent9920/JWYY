# ============================================================================
# 百人队文体风格卡 v1  （《明》· 后期文体 · 第一人称限知行军叙事）
# ----------------------------------------------------------------------------
# 这份卡回答两个不同的问题，务必分清：
#   表一 风格层：像不像这一路文体（作者文体常数 + 叙事参数）
#   表二 检测层：能不能过 AI 检测（朱雀实证区间）
# 二者会冲突：只追检测层会把文体常数冲掉。双表都要过才算成品。
#
# 三层基线（勿混用）：
#   orig  原著后 25%（约 29 万字）—— 作者味道基准
#   hit   百人队片段2 —— 朱雀实测 AIGC 0.3582「人工特征」，唯一有回执的实证点
#   pass  百人队优化版 —— 双表全过且风格未丢的合成样本
#
# 数据日期 2026-09-17 ｜ 语料《明》酒徒（115 万字）
# ============================================================================

meta:
  name: "百人队文体"
  origin: "酒徒《明》后期文体 · 第一人称限知 · 行军日志式叙事"
  corpus: "原著 115 万字；后期切片 29 万字；靶心样本 346 字"
  validated_by: "朱雀 AI 检测（matrix.tencent.com/ai-detect），靶心 AIGC 0.3582 = 人工特征"
  key_rule: "先守文体常数，再追检测指标。顺序反了就会写出「过了检测但不是他写的」的东西"

# ---------------------------------------------------------------------------
# 一、叙事参数 —— 这是「选择」，不是「风格」。不判达标，用于识别归属
# ---------------------------------------------------------------------------
narrative_params:
  人称与视点:
    choice_a: "第三人称全知（炉火那一类）"
    choice_b: "第一人称限知（本卡所属）"
    measured:
      我‰: { orig: 6.95, hit: 28.90, pass: 26.73, note: "≈0 是第三人称；25–30 是第一人称" }
      第一人称句占比%: { orig: 13.20, hit: 55.56, pass: 42.11, note: "0–13 第三人称；42–56 第一人称" }
    warning: |
      原著后期整体「第一人称句占比」只有 13.2%，而靶心样本高达 55.6%。
      说明靶心的高分特征有一半来自「第一人称」这个叙事选择，
      而非作者的文体本身。换叙事人称等于换卡，不要混用参数。
  时间感:
    自然时间‰: { orig: 0.13, hit: 0.00, pass: 6.29, note: "行军日志式 1–6；多线小说 ≈0.1" }
    时间戳‰: { rule: "禁用", evidence: "「次日」在原著全书仅出现 1 次" }
  体裁:
    含引号段占比%: { orig: 58.77, hit: 50.00, pass: 50.00 }
    note: "多线小说对话更密；单一视角行军段更疏。本卡取 45–65"

# ---------------------------------------------------------------------------
# 二、文体常数 —— 动了就不像这个人。这是底线，不得为凑检测指标而牺牲
# ---------------------------------------------------------------------------
style_constants:
  段均长:
    range: [78, 112]
    measured: { orig: 103.57, hit: 86.50, pass: 90.86 }
    why: "厚段落是该作者的跨阶段常数（原著前 100.8 / 后 103.6，几乎不变）"
    action: "对话嵌在叙述段里，不拆成独立短行。拆段会立刻掉出区间"
  对话占比%:
    range: [14, 26]
    measured: { orig: 20.92, hit: 15.61, pass: 19.18 }
    why: "为凑「短句占比」指标最容易在这里过冲，实测案例冲到 35.84 已被判不合格"
  含引号段占比%:
    range: [45, 65]
    measured: { orig: 58.77, hit: 50.00, pass: 50.00 }
  段内逗号均:
    range: [5.5, 8.5]
    measured: { orig: 6.89, hit: 6.50, pass: 6.57 }
    why: "段内要有喘息，不能是短句堆叠"
  逗号比句号:
    range: [1.15, 1.80]
    measured: { orig: 2.04, hit: 1.44, pass: 1.23 }
    why: "原著 2.04 偏高；本文体要压到 1.8 以下"
  顿号‰:
    range: [0, 1.0]
    measured: { orig: 2.09, hit: 0.00, pass: 0.00 }
    action: "'清砂、修膛、校直' → '清砂，还得修膛，还得校直'"
  明喻‰:
    range: [0, 0.4]
    measured: { orig: 0.88, hit: 0.00, pass: 0.00 }
    action: "删 像/好像/似的/如同/仿佛/恰似。改直陈或换具体细节：'像树根'→'骨节大'"
  '"也"‰':
    range: [0, 2.5]
    measured: { orig: 3.38, hit: 0.00, pass: 1.57 }
    action: "砍排比式『也』。'不敢递上去，也不敢烧' → '不敢递上去，索性揣在心里'"
  数字密度‰:
    range: [30, 100]
    measured: { orig: 26.71, hit: 37.57, pass: 51.89 }
    why: "器物与数字是人味最硬的部分，宁多勿少"
  量词密度‰:
    range: [35, 90]
    measured: { orig: 26.88, hit: 43.35, pass: 61.32 }
    why: "同上。斤/两/里/匹/把/壶/碗/门/条/层 —— 具体到可称可量"
  生理体态‰:
    range: [0.8, 6.0]
    measured: { orig: 1.90, hit: 0.00, pass: 2.36 }
    why: "情绪靠手抖/喉头/后背/后颈/汗外化，禁直陈"
  心理直陈‰:
    range: [0, 1.0]
    measured: { orig: 0.73, hit: 0.00, pass: 0.00 }
    action: "禁「他觉得难过/害怕/高兴」，改生理反应与体态动作"

# ---------------------------------------------------------------------------
# 三、检测层约束 —— 朱雀实证区间，唯一有回执的部分
# ---------------------------------------------------------------------------
detector_bands:
  句均长: { range: [0, 20], hit: 19.22, flagged: [25.86, 29.57] }
  长句≥40占比%: { range: [0, 5], hit: 0.0, flagged: [16.67, 27.5], action: "硬禁，一句不留" }
  '≥3逗号句占比%': { range: [0, 14], hit: 11.11, flagged: [38.89, 42.5], action: "一句最多两个逗号" }
  短句≤10占比%: { range: [18, 99], hit: 16.67, flagged: [8.33, 7.5], action: "目标点位 16.67，留余量" }
  句长变异系数: { range: [0.36, 0.64], hit: 0.47, flagged: [0.47, 0.56], action: "长短必须参差" }
  引号组每千字: { range: [11.5, 99], hit: 11.56, flagged: [7.52, 6.76] }
  逻辑连接‰: { range: [0, 1.2], hit: 0.0, flagged: [1.07, 0.0], action: "删 因此/然而/于是/并且" }

# ---------------------------------------------------------------------------
# 四、签名手法 —— 每种配原文例句，没有例句的技法等于没有约束力
# ---------------------------------------------------------------------------
signatures:

  S1_开场用自然现象加时间锚:
    rule: "开篇落在雾/日头/月色这类自然物象上，时间靠物象暗示，不用时间戳"
    example: "出发那天早晨起了雾。草原上的雾跟中原的不一样，不遮天，只贴着地皮，薄薄一层白。马踏进去，再拔出来，雾就跟着颤一颤。"

  S2_朴素格言不押韵:
    rule: "下判断时用大白话，结构不对称，不追求对仗。说完不解释，或只补一句更冷的"
    example: "人各有各的活法，各有各的死法。你替他多说一句，他照样不会少挨一刀。"
    counter: "反例（本作者早期写法，勿用）：『守本分而不肯含糊，知利害而不肯推诿』—— 对仗即高分侧"

  S3_具体名物堆叠:
    rule: "数字＋量词＋器物。宁可显得琐碎，不可抽象概括"
    example: "八百多人的队伍拉成一条长线往南去，尾巴还拖在营里没出来。"
    example2: "牛马羊群一天只能挪二十里。"

  S4_否定式短评用句号断开:
    rule: "列举动作用句号逐条断开（不是顿号不是分号），末尾用「没有……没有……」收"
    example: "那天夜里我们只做了三件事。放走他们的马。割断拴马的绳子。割开河床上那几十头牛的蹄子皮。没有杀一个人，没有点一把火。"

  S5_判断驱动不是情绪驱动:
    rule: "情节靠人物的知道/明白/盘算/料定推进，不靠情绪起伏"
    example: "我说不会，草原上的部落横竖走不动。"
    example2: "我趴在草里看了半天，到底没动。"

  S6_口语标记词锚定语感:
    rule: "反正/到底/横竖/索性/其实/偏偏/好歹 —— 每千字 4–8 处，分散放，不扎堆"
    example: "反正他们要回去的。"
    example2: "想了想，到底没有开口。"

  S7_对话嵌段不独立成行:
    rule: "说话人、动作、引语同处一段；对话与叙述交替，不切成一问一答的独立行"
    example: "他笑了笑，把酒倒进碗里递给我。“头，我昨天夜里想了半宿。”他说，“你最后那句话说了岔了。”"
    warning: "这条同时决定「段均长」和「含引号段占比」两项常数，是结构总闸"

  S8_收束不升华:
    rule: "章节或段落结尾用平实的未完成态收住，不总结、不抒情、不点题"
    example: "这一路还长，能哼就让他们哼吧。"
    example2: "至于他们肯不肯跟我坐下来喝碗奶茶，到时候再说。"

  S9_情绪走生理通道:
    rule: "写情绪必落到身体：后颈发酸 / 喉头动 / 眼圈红 / 手抖 / 全是汗。不写内心感受的形容词"
    example: "我站了一会儿，忽然觉着后颈发酸，抬手一摸，全是汗。"
    example2: "他愣了半天，忽然笑了。"

  S10_自然时间推进:
    rule: "行军段落用「头三天 / 第四天中午 / 傍晚的时候 / 那天夜里 / 月亮升起来的时候」推进，不用「三天后」"
    example: "头三天，一个蒙古部落也没碰上。……第四天中午，前哨回来报。"
    caution: "此项属叙事参数，不是所有场景都适用"

# ---------------------------------------------------------------------------
# 五、反面清单
# ---------------------------------------------------------------------------
anti_patterns:
  - "对偶金句（本作者早期写法，检测器高分侧）"
  - "顿号名词枚举"
  - "明喻（像/好像/似的）"
  - "长复合句（40 字以上）"
  - "书面逻辑连接词（因此/然而/于是/并且）"
  - "心理直陈（他觉得难过／心里一阵酸）"
  - "时间戳（次日／翌日／三天后）"
  - "对话独立成行＋连续对白轰炸"
  - "段末升华、结尾点题"
  - "堆砌句末语气词换「口语感」（原著「罢」全篇仅 9 次且全是「作罢」，应为「吧」）"
  - "为凑「短句占比」而狂加对话（会让对话占比冲破 26% 上限）"

# ---------------------------------------------------------------------------
# 六、生成提示词模板（直接可用）
# ---------------------------------------------------------------------------
prompt_template: |
  以酒徒《明》后期文体写作，第一人称限知视角。严格遵守：

  【文体常数 · 不得违背】
  1) 段均 78–112 汉字。对话必须嵌在叙述段里，不独立成行；含引号段占 45–65%。
  2) 对话占全文 14–26% —— 不得为凑短句指标而狂加对话。
  3) 逗号∶句号 1.15–1.80；段内逗号 5.5–8.5 个。
  4) 禁顿号枚举（≤1‰）；禁明喻（≤0.4‰）；排比式「也」≤2.5‰。
  5) 数字与量词密度要高（数字 ≥30‰、量词 ≥35‰）：器物、斤两、里程、人数写具体。
  6) 禁心理直陈。情绪一律走生理与体态（后背／喉头／手／汗／眼圈），≥0.8‰。

  【检测层 · 目标】
  7) 句均 ≤20 汉字；任何一句不超过 40 字。
  8) 一句最多两个逗号；短句（≤10 字）占比 ≥18%。
  9) 句长必须参差（变异系数 0.36–0.64）。
  10) 禁「因此／然而／于是／并且」。

  【手法】
  11) 开篇落在自然物象上（雾／日头／月色），时间靠物象暗示。
  12) 下判断用不对称的大白话，不用对偶。说完不解释。
  13) 列举动作用句号逐条断开，不用顿号。
  14) 情节靠「知道／明白／盘算／料定」推进，不靠情绪起伏。
  15) 口语标记词（反正／到底／横竖／索性／其实）每千字 4–8 处，分散放。
  16) 结尾平实收住，不只总结不抒情。

  写完后跑 `python scripts/bai_style_check.py 稿件.txt`，两表都要过。

# ---------------------------------------------------------------------------
# 七、与「炉火」（本作者早期文体）的区别 —— 换卡不换参数
# ---------------------------------------------------------------------------
vs_zaoqi:
  为什么必须分开:
    - "同一作者两个阶段：早期 句均 32.87 / 短句 7.20% / 段长变异 0.86；后期 26.78 / 15.66% / 0.74"
    - "叙事人称不同：炉火第三人称（我‰ = 0），百人队第一人称（我‰ ≈ 27）"
    - "混用一套参数会把每个文体都拉向另一个，实测炉火被拉到对话占比 35.84%、含引号段 75%，双双破线"
  实测对照:
    | 维度 | 原著早期 | 原著后期 | 炉火(优化) | 百人队(优化) |
    |---|---|---|---|---|
    | 我‰ | 4.83 | 6.95 | 0.00 | 26.73 |
    | 第一人称句占比% | 11.25 | 13.20 | 0.00 | 42.11 |
    | 句均长 | 32.87 | 26.78 | 15.53 | 16.74 |
    | 对话占比% | 25.94 | 20.92 | 35.84 | 19.18 |
    | 问号‰ | 0.70 | 2.54 | 6.61 | 0.79 |
    | 生理体态‰ | 1.37 | 1.90 | 5.78 | 2.36 |
  结论: "句法节奏被同一套检测规则强行对齐了（差 8–22%），但人称、时间感、对话密度、情绪外化方式仍显著分化 —— 它们不是同一风格"
  用法: "要写堂审／官场／第三人称场景 → 用早期文体卡；要写第一人称行军／边地／日志体 → 用本卡"

# ---------------------------------------------------------------------------
# 八、生成验证（本卡可执行性的证据）
# ---------------------------------------------------------------------------
generation_proof:
  说明: "2026-09-17 用本卡从零写了一段全新场景（雨中河湾截铁队，833 字），双表全过"
  实测:
    汉字数: 833
    段数: 10
    句数: 54
    段均长: 83.30
    含引号段占比%: 60.00
    段内逗号均: 6.50
    句均长: 15.43
    句长变异系数: 0.58
    短句≤10占比%: 31.48
    长句≥40占比%: 0.00
    逗号比句号: 1.20
    顿号‰: 0.00
    明喻‰: 0.00
    '"也"‰': 1.20
    引号组每千字: 18.01
    对话占比%: 24.25
    数字密度‰: 58.82
    量词密度‰: 61.22
    生理体态‰: 4.80
  结果: "表一：文体常数被破坏 0 项 ｜ 表二：超标 0 项，r = 0.000"
  第一版失败记录: |
    首版 819 字 / 18 段，段均长仅 45.50（应为 78–112），段内逗号均 3.11（应 5.5–8.5），
    含引号段 38.89%（应 45–65），逗号比句号 0.89（应 ≥1.15），"也"‰ 4.88（应 ≤2.5），
    连破 6 项文体常数。
    根因单一：把对话拆成了独立成行的短段 —— 这是现代网文写法。
    修法：把 9 处独立对话行并回相邻叙述段，段数 18→10，段均长 45.5→83.3，一次通过。
  结论: "本卡的主要失效点永远是「对话独立成行」这一条。写作时先盯住它。"

# ---------------------------------------------------------------------------
# 九、判别力验证（能否把「非本文体」认出来）
# ---------------------------------------------------------------------------
discrimination_proof:
  测试: "用本卡检查《炉火_优化版》（同一作者，但属早期第三人称文体）"
  结果:
    表一: "文体常数被破坏 2 项 —— 含引号段占比 75.00（应 45–65）、对话占比 35.84（应 14–26）"
    表二: "超标 1 项，r = 0.019（几乎全过）"
  意义: |
    检测层几乎全过（因为两者用了同一套降痕规则），风格层却被抓出 2 项破线。
    这证明「两篇不是同一风格」是可机器验证的，也证明双表的必要性 ——
    只跑检测层会误判为合格。
  对照: "本体样本《百人队_优化版》表一 0 破、表二 0 超标，r = 0.000"

# ---------------------------------------------------------------------------
# 十、验收
# ---------------------------------------------------------------------------
acceptance:
  - "跑 `python scripts/bai_style_check.py 稿件.txt`"
  - "表一：文体常数被破坏 0 项"
  - "表二：超标 0 项，风险指数 r = 0.000"
  - "两表都过之后，人工通读一遍 —— 确认读起来仍然认得出是谁写的"
  - "投检：纯正文粘贴，看逐块 AIGC 值是否都 < 0.5（检测器按长度切块逐块打分）"
